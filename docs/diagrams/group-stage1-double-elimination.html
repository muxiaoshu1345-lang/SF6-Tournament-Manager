<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4人双败淘汰赛对战图</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --color-soft:    #7a8399;
      --color-rule:    rgba(45,49,66,0.12);
      --color-link:    #2e5aa8;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1000px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 800px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Tournament · Double Elimination</p>
    <h1>4人双败淘汰赛对战图</h1>

    <svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ========== 布局常量 ==========
           列:  R1_X=32   WR1/LR1_X=280   LR2_X=520   RESULT_X=700
           卡片: W=148, H=24, GAP=8
           行间距: 64px (H+GAP+H+GAP = 24+8+24+8=64, 取80为match间距)
      -->

      <!-- ========== 连线（先画，z-order在节点下方）========== -->

      <!-- R1[0] 胜者 → WR1 上槽 -->
      <!-- 路径: 卡片右侧 → 水平40px → 垂直对齐 → 水平到目标 -->
      <line x1="180" y1="60" x2="220" y2="60" stroke="#4f5d75" stroke-width="1"/>
      <line x1="220" y1="60" x2="220" y2="140" stroke="#4f5d75" stroke-width="1"/>
      <line x1="220" y1="140" x2="280" y2="140" stroke="#4f5d75" stroke-width="1"/>

      <!-- R1[0] 败者 → LR1 上槽 -->
      <line x1="180" y1="60" x2="220" y2="60" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="220" y1="60" x2="220" y2="300" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="220" y1="300" x2="280" y2="300" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>

      <!-- R1[1] 胜者 → WR1 下槽 -->
      <line x1="180" y1="200" x2="220" y2="200" stroke="#4f5d75" stroke-width="1"/>
      <line x1="220" y1="200" x2="220" y2="168" stroke="#4f5d75" stroke-width="1"/>
      <line x1="220" y1="168" x2="280" y2="168" stroke="#4f5d75" stroke-width="1"/>

      <!-- R1[1] 败者 → LR1 下槽 -->
      <line x1="180" y1="200" x2="220" y2="200" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="220" y1="200" x2="220" y2="328" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="220" y1="328" x2="280" y2="328" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>

      <!-- LR1 胜者 → LR2 上槽 -->
      <line x1="428" y1="314" x2="468" y2="314" stroke="#4f5d75" stroke-width="1"/>
      <line x1="468" y1="314" x2="468" y2="396" stroke="#4f5d75" stroke-width="1"/>
      <line x1="468" y1="396" x2="520" y2="396" stroke="#4f5d75" stroke-width="1"/>

      <!-- WR1 败者 → LR2 下槽 -->
      <line x1="428" y1="154" x2="468" y2="154" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="468" y1="154" x2="468" y2="424" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="468" y1="424" x2="520" y2="424" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>

      <!-- ========== 节点 ========== -->

      <!-- 胜者组标签 -->
      <text x="32" y="24" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">WINNERS BRACKET</text>

      <!-- R1[0]: A vs B -->
      <rect x="32" y="36" width="148" height="24" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="40" y="52" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">选手 A</text>
      <text x="172" y="52" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">0</text>

      <rect x="32" y="64" width="148" height="24" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="40" y="80" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">选手 B</text>
      <text x="172" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">0</text>

      <text x="106" y="30" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">R1 · Match 1</text>

      <!-- R1[1]: C vs D -->
      <rect x="32" y="176" width="148" height="24" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="40" y="192" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">选手 C</text>
      <text x="172" y="192" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">0</text>

      <rect x="32" y="204" width="148" height="24" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="40" y="220" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">选手 D</text>
      <text x="172" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">0</text>

      <text x="106" y="170" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">R1 · Match 2</text>

      <!-- WR1: 胜者组决赛 -->
      <rect x="280" y="128" width="148" height="24" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="288" y="144" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">待定</text>
      <text x="420" y="144" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">0</text>

      <rect x="280" y="156" width="148" height="24" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="288" y="172" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">待定</text>
      <text x="420" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">0</text>

      <text x="354" y="122" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">WR1 · 胜者组决赛</text>

      <!-- 败者组标签 -->
      <text x="32" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LOSERS BRACKET</text>

      <!-- LR1: 败者组第一轮 -->
      <rect x="280" y="288" width="148" height="24" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="288" y="304" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">待定</text>
      <text x="420" y="304" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">0</text>

      <rect x="280" y="316" width="148" height="24" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="288" y="332" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">待定</text>
      <text x="420" y="332" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">0</text>

      <text x="354" y="282" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">LR1 · 败者组第一轮</text>

      <!-- LR2: 败者组决赛 -->
      <rect x="520" y="384" width="148" height="24" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="528" y="400" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">待定</text>
      <text x="660" y="400" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">0</text>

      <rect x="520" y="412" width="148" height="24" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="528" y="428" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">待定</text>
      <text x="660" y="428" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">0</text>

      <text x="594" y="378" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">LR2 · 败者组决赛</text>

      <!-- 第1名卡片槽位 -->
      <rect x="520" y="128" width="128" height="24" rx="4" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1.5"/>
      <text x="528" y="144" fill="#eb6c36" font-size="11" font-weight="600" font-family="'Geist', sans-serif">🏆 待定</text>
      <text x="640" y="144" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">第1名</text>
      <text x="584" y="122" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">WINNER</text>

      <!-- 第1名连线 -->
      <line x1="428" y1="140" x2="468" y2="140" stroke="#eb6c36" stroke-width="1"/>
      <line x1="468" y1="140" x2="468" y2="140" stroke="#eb6c36" stroke-width="1"/>
      <line x1="468" y1="140" x2="520" y2="140" stroke="#eb6c36" stroke-width="1"/>

      <!-- 第2名卡片槽位 -->
      <rect x="700" y="396" width="128" height="24" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="708" y="412" fill="#eb6c36" font-size="11" font-weight="600" font-family="'Geist', sans-serif">🥈 待定</text>
      <text x="820" y="412" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">第2名</text>
      <text x="764" y="390" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">RUNNER-UP</text>

      <!-- 第2名连线 -->
      <line x1="668" y1="410" x2="700" y2="410" stroke="#eb6c36" stroke-width="1"/>

      <!-- 图例 -->
      <line x1="32" y1="464" x2="768" y2="464" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="472" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="116" y1="468" x2="148" y2="468" stroke="#4f5d75" stroke-width="1"/>
      <text x="156" y="472" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace">胜者路径</text>

      <line x1="244" y1="468" x2="276" y2="468" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="284" y="472" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace">败者路径</text>

      <rect x="372" y="462" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/>
      <text x="390" y="472" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace">焦点 (第1名)</text>

    </svg>
  </div>
</body>
</html>
