<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4人双败淘汰赛对战图</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --color-soft:    #7a8399;
      --color-rule:    rgba(45,49,66,0.12);
      --color-link:    #2e5aa8;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1000px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 800px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Tournament · Double Elimination</p>
    <h1>4人双败淘汰赛对战图</h1>

    <svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ========== 连线（先画，z-order在节点下方）========== -->

      <!-- R1[0] 胜者 → WR1 上槽 -->
      <line x1="192" y1="72" x2="240" y2="72" stroke="#4f5d75" stroke-width="1"/>
      <line x1="240" y1="72" x2="240" y2="140" stroke="#4f5d75" stroke-width="1"/>
      <line x1="240" y1="140" x2="280" y2="140" stroke="#4f5d75" stroke-width="1"/>

      <!-- R1[0] 败者 → LR1 上槽 -->
      <line x1="192" y1="72" x2="240" y2="72" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="240" y1="72" x2="240" y2="300" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="240" y1="300" x2="280" y2="300" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>

      <!-- R1[1] 胜者 → WR1 下槽 -->
      <line x1="192" y1="212" x2="240" y2="212" stroke="#4f5d75" stroke-width="1"/>
      <line x1="240" y1="212" x2="240" y2="188" stroke="#4f5d75" stroke-width="1"/>
      <line x1="240" y1="188" x2="280" y2="188" stroke="#4f5d75" stroke-width="1"/>

      <!-- R1[1] 败者 → LR1 下槽 -->
      <line x1="192" y1="212" x2="240" y2="212" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="240" y1="212" x2="240" y2="348" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="240" y1="348" x2="280" y2="348" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>

      <!-- LR1 胜者 → LR2 上槽 -->
      <line x1="432" y1="324" x2="480" y2="324" stroke="#4f5d75" stroke-width="1"/>
      <line x1="480" y1="324" x2="480" y2="400" stroke="#4f5d75" stroke-width="1"/>
      <line x1="480" y1="400" x2="520" y2="400" stroke="#4f5d75" stroke-width="1"/>

      <!-- WR1 败者 → LR2 下槽 -->
      <line x1="432" y1="164" x2="480" y2="164" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="480" y1="164" x2="480" y2="448" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="480" y1="448" x2="520" y2="448" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>

      <!-- ========== 节点 ========== -->

      <!-- 胜者组标签 -->
      <text x="16" y="24" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">WINNERS BRACKET</text>

      <!-- R1[0]: A vs B -->
      <rect x="32" y="48" width="148" height="24" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="40" y="64" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">选手 A</text>
      <text x="168" y="64" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">0</text>

      <rect x="32" y="80" width="148" height="24" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="40" y="96" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">选手 B</text>
      <text x="168" y="96" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">0</text>

      <text x="106" y="42" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">R1 · Match 1</text>

      <!-- R1[1]: C vs D -->
      <rect x="32" y="188" width="148" height="24" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="40" y="204" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">选手 C</text>
      <text x="168" y="204" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">0</text>

      <rect x="32" y="220" width="148" height="24" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="40" y="236" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">选手 D</text>
      <text x="168" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">0</text>

      <text x="106" y="182" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">R1 · Match 2</text>

      <!-- WR1: 胜者组决赛 -->
      <rect x="280" y="128" width="148" height="24" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="288" y="144" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">待定</text>
      <text x="416" y="144" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">0</text>

      <rect x="280" y="176" width="148" height="24" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="288" y="192" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">待定</text>
      <text x="416" y="192" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">0</text>

      <text x="354" y="122" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">WR1 · 胜者组决赛</text>

      <!-- 败者组标签 -->
      <text x="16" y="280" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LOSERS BRACKET</text>

      <!-- LR1: 败者组第一轮 -->
      <rect x="280" y="288" width="148" height="24" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="288" y="304" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">待定</text>
      <text x="416" y="304" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">0</text>

      <rect x="280" y="336" width="148" height="24" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="288" y="352" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">待定</text>
      <text x="416" y="352" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">0</text>

      <text x="354" y="282" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">LR1 · 败者组第一轮</text>

      <!-- LR2: 败者组决赛 -->
      <rect x="520" y="388" width="148" height="24" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="528" y="404" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">待定</text>
      <text x="656" y="404" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">0</text>

      <rect x="520" y="436" width="148" height="24" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="528" y="452" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">待定</text>
      <text x="656" y="452" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">0</text>

      <text x="594" y="382" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">LR2 · 败者组决赛</text>

      <!-- 结果标注 -->
      <text x="520" y="108" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist', sans-serif">🏆 第1名</text>
      <text x="520" y="124" fill="#7a8399" font-size="10" font-family="'Geist', sans-serif">胜者组冠军</text>

      <text x="700" y="400" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist', sans-serif">🥈 第2名</text>
      <text x="700" y="416" fill="#7a8399" font-size="10" font-family="'Geist', sans-serif">败者组冠军</text>

      <!-- 图例 -->
      <line x1="16" y1="470" x2="784" y2="470" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="16" y="478" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="100" y1="474" x2="130" y2="474" stroke="#4f5d75" stroke-width="1"/>
      <text x="136" y="478" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace">胜者路径</text>

      <line x1="220" y1="474" x2="250" y2="474" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="256" y="478" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace">败者路径</text>

      <rect x="350" y="468" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/>
      <text x="368" y="478" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace">焦点 (第1名)</text>

    </svg>
  </div>
</body>
</html>
